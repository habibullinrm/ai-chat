services:
  db:
    image: postgres:15-alpine
    container_name: aichat-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aichat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aichat}
      POSTGRES_DB: ${POSTGRES_DB:-aichat}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aichat}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aichat-network

  redis:
    image: redis:7-alpine
    container_name: aichat-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aichat-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aichat-backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://aichat:aichat@db:5432/aichat}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DEBUG: ${DEBUG:-true}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - aichat-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aichat-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${BACKEND_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - aichat-network

volumes:
  postgres_data:
  redis_data:

networks:
  aichat-network:
    driver: bridge
