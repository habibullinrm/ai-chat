# Конфигурация Alembic для AI-Chat

[alembic]
# Путь к скриптам миграций
script_location = alembic

# Шаблон имён файлов миграций с датой
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s

# Добавить текущую директорию в sys.path
prepend_sys_path = .

# Разделитель путей версий
version_path_separator = os

# URL базы данных (переопределяется в env.py из настроек)
sqlalchemy.url = postgresql+asyncpg://aichat:aichat@db:5432/aichat

[post_write_hooks]
# Форматирование с помощью ruff
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

# Логирование
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S